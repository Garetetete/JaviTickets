name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  tests:
    name: Tests (PHP 8.2 + PostgreSQL 16)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qr_ticketing_test
          POSTGRES_USER: qr_user
          POSTGRES_PASSWORD: qr_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U qr_user -d qr_ticketing_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: qr_ticketing_test
      DB_USERNAME: qr_user
      DB_PASSWORD: qr_secret
      QR_SECRET: ci-secret-0123456789abcdef0123456789abcdef0123456789
      QR_KEY_VERSION: 1

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, gd, bcmath, zip
          coverage: none

      - name: Copiar .env
        run: cp .env.example .env

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generar claves
        run: |
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Correr tests
        run: php artisan test
